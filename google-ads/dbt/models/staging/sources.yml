# Point each `schema` at wherever your loader lands these tables.

version: 2

sources:
  - name: google_ads
    schema: raw_google_ads
    tables:
      - name: account
      - name: ad
      - name: ad_group
      - name: ad_group_country_stats
      - name: ad_stats
      - name: campaign
      - name: campaign_stats
      - name: geo_target
